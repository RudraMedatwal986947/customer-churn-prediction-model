name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-tests:
    name: Code Quality, Unit Tests & MLOps Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax compilation
        run: |
          python -c "
          import glob, py_compile
          files = glob.glob('**/*.py', recursive=True)
          for f in files:
              if not any(x in f for x in ['.venv', 'venv', '.git']):
                  py_compile.compile(f, doraise=True)
          print('All Python modules compiled cleanly.')
          "

      - name: Run Pytest test suite
        run: |
          pytest tests/ -v

      - name: Model Artifact Sanity Gate
        run: |
          python -c "
          import joblib, os
          for f in ['churn_xgboost_model.pkl', 'scaler.pkl', 'clv_xgboost_model.pkl', 'clv_scaler.pkl', 'kmeans_model.pkl']:
              path = os.path.join('models', f)
              assert os.path.exists(path), f'Missing model artifact: {path}'
              obj = joblib.load(path)
              assert obj is not None, f'Corrupted model artifact: {path}'
          print('All production model artifacts verified successfully.')
          "

  docker-build-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: code-quality-and-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: churn-api:latest

      - name: Build Streamlit Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: false
          tags: churn-dashboard:latest
